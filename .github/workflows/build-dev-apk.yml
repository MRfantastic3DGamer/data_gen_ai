# Builds a development (debug) Android APK and uploads it as a workflow artifact.
# Firebase config is injected from GitHub Secrets — not stored in the repo.
# Download from: Actions → latest run → Artifacts → data-gen-ai-dev-apk
name: Build Dev APK

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dev-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-apk:
    name: Flutter dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART_B64" ] || [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Missing GitHub secrets FIREBASE_OPTIONS_DART_B64 and/or GOOGLE_SERVICES_JSON_B64."
            echo "::error::See docs/GITHUB_SECRETS.md — run tool/encode_firebase_secrets.ps1 locally, then add secrets in repo Settings."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          test -s lib/firebase_options.dart
          test -s android/app/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "dist/data-gen-ai-dev-${GITHUB_SHA::7}.apk"

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: data-gen-ai-dev-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
